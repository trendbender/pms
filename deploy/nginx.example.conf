# Example nginx vhost for a self-hosted PMS.
# One origin: Next.js frontend at /, FastAPI backend under /api/ (prefix stripped).
# Replace your-domain.com and the upstream ports to match your setup, then obtain
# a TLS certificate (e.g. with certbot) before enabling the 443 server block.

# Basic rate-limit zone (declare once, in the http {} context).
# limit_req_zone $binary_remote_addr zone=pms_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 20m;

    # FastAPI backend. The trailing slash on proxy_pass strips the /api/ prefix
    # so it maps onto the app's root routes.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Content-addressed build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js frontend. HTML documents must NOT be cached (a stale shell can
    # serve dead JS chunks and blank the page after a deploy).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Hardening: PMS defines no Next.js Server Actions, so reject any request
        # carrying a Server Action header (a known Next.js RCE vector).
        if ($http_next_action) { return 403; }

        # limit_req zone=pms_rl burst=40 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
